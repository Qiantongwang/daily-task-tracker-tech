<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Daily OS · 任务 + 笔记</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#191919;--sidebar:#202020;--surface:#252525;--surface2:#2f2f2f;--hover:#333;--border:#3a3a3a;--text:#e3e3e3;--text-muted:#9b9b9b;--text-dim:#6b6b6b;--primary:#2383e2;--primary-soft:rgba(35,131,226,.15);--success:#4dab9a;--warning:#e0a100;--danger:#e03e3e;--purple:#9065b0;--radius:6px;--font:'Noto Sans SC',system-ui,sans-serif;--mono:'JetBrains Mono',monospace}
*{box-sizing:border-box;margin:0;padding:0}html,body{height:100%}
body{font-family:var(--font);background:var(--bg);color:var(--text);display:flex;overflow:hidden}
.sidebar{width:240px;min-width:240px;background:var(--sidebar);border-right:1px solid var(--border);display:flex;flex-direction:column;height:100vh;transition:.2s}
.sidebar.collapsed{width:0;min-width:0;overflow:hidden;border:none}
.sidebar-header{padding:14px;display:flex;align-items:center;gap:10px}
.workspace-icon{width:28px;height:28px;background:linear-gradient(135deg,#2383e2,#9065b0);border-radius:6px;display:grid;place-items:center;font-size:14px;flex-shrink:0}
.workspace-name{font-weight:600;font-size:.9rem;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sidebar-nav{flex:1;overflow-y:auto;padding:6px 8px}
.nav-section{margin-bottom:16px}
.nav-label{font-size:.7rem;color:var(--text-dim);padding:4px 10px;text-transform:uppercase;letter-spacing:.04em;font-weight:500}
.nav-item{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:var(--radius);cursor:pointer;font-size:.875rem;color:var(--text-muted);transition:.12s;user-select:none}
.nav-item:hover{background:var(--hover);color:var(--text)}
.nav-item.active{background:var(--primary-soft);color:var(--primary);font-weight:500}
.nav-item .icon{font-size:1rem;width:20px;text-align:center}
.nav-item .count{margin-left:auto;font-size:.75rem;color:var(--text-dim);background:var(--surface2);padding:1px 6px;border-radius:10px}
.nav-item.active .count{background:rgba(35,131,226,.25);color:var(--primary)}
.sidebar-footer{padding:10px 12px;border-top:1px solid var(--border);font-size:.75rem;color:var(--text-dim)}
.main{flex:1;display:flex;flex-direction:column;height:100vh;overflow:hidden;min-width:0}
.topbar{height:48px;border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 16px;gap:12px;flex-shrink:0;background:var(--bg)}
.menu-btn{background:transparent;border:none;color:var(--text-muted);cursor:pointer;width:32px;height:32px;border-radius:6px;font-size:18px;display:grid;place-items:center}
.menu-btn:hover{background:var(--hover);color:var(--text)}
.breadcrumb{font-size:.875rem;color:var(--text-muted);display:flex;align-items:center;gap:6px}
.breadcrumb strong{color:var(--text);font-weight:500}
.topbar-right{margin-left:auto}
.save-indicator{font-size:.75rem;color:var(--text-dim);transition:color .3s}
.save-indicator.saved{color:var(--success)}
.save-indicator.saving{color:var(--warning)}
.content{flex:1;overflow-y:auto;padding:32px 48px 80px}
@media(max-width:700px){.content{padding:20px 16px 60px}.sidebar{position:fixed;z-index:50;height:100%;box-shadow:4px 0 24px rgba(0,0,0,.4)}}
.page-title{font-size:2rem;font-weight:700;margin-bottom:4px;letter-spacing:-.03em;outline:none;border:none;background:transparent;color:var(--text);width:100%;font-family:inherit}
.page-title::placeholder{color:var(--text-dim)}
.page-meta{font-size:.8rem;color:var(--text-dim);margin-bottom:28px;display:flex;gap:16px;flex-wrap:wrap}
.date-bar{display:flex;align-items:center;gap:8px;margin-bottom:24px;flex-wrap:wrap}
.date-bar input[type=date]{background:var(--surface);border:1px solid var(--border);border-radius:6px;color:var(--text);font-family:inherit;padding:6px 10px;font-size:.875rem}
.date-bar input[type=date]::-webkit-calendar-picker-indicator{filter:invert(.7);cursor:pointer}
.quick-add{display:flex;gap:8px;margin-bottom:20px}
.quick-add input{flex:1;background:var(--surface);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:inherit;font-size:.95rem;padding:12px 14px;outline:none}
.quick-add input:focus{border-color:var(--primary)}
.quick-add input::placeholder{color:var(--text-dim)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:8px 14px;border:none;border-radius:6px;font-family:inherit;font-size:.875rem;font-weight:500;cursor:pointer;transition:.12s;white-space:nowrap}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{filter:brightness(1.1)}
.btn-ghost{background:transparent;color:var(--text-muted);border:1px solid var(--border)}
.btn-ghost:hover{background:var(--hover);color:var(--text)}
.btn-sm{padding:5px 10px;font-size:.8rem}
.btn-icon{width:32px;height:32px;padding:0;background:transparent;border:none;color:var(--text-muted);border-radius:6px;cursor:pointer}
.btn-icon:hover{background:var(--hover);color:var(--text)}
.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:24px}
@media(max-width:600px){.stats-row{grid-template-columns:repeat(2,1fr)}}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:14px 16px}
.stat-card .label{font-size:.75rem;color:var(--text-dim)}
.stat-card .value{font-size:1.5rem;font-weight:700;margin-top:2px}
.stat-card .value.blue{color:var(--primary)}.stat-card .value.green{color:var(--success)}.stat-card .value.yellow{color:var(--warning)}.stat-card .value.purple{color:var(--purple)}
.task-list{display:flex;flex-direction:column;gap:6px}
.task-item{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:start;padding:12px 14px;background:var(--surface);border:1px solid var(--border);border-radius:8px;transition:border-color .12s}
.task-item:hover{border-color:#4a4a4a}
.task-item.done{opacity:.65}
.task-item.done .task-title{text-decoration:line-through;color:var(--text-muted)}
.checkbox{width:20px;height:20px;border:2px solid var(--border);border-radius:4px;cursor:pointer;margin-top:2px;display:grid;place-items:center;transition:.12s;flex-shrink:0}
.checkbox.checked{background:var(--success);border-color:var(--success)}
.checkbox.checked::after{content:'✓';color:#fff;font-size:12px;font-weight:bold}
.task-title{font-size:.95rem;font-weight:500;word-break:break-word}
.task-meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;align-items:center}
.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:4px;font-size:.7rem;font-weight:500}
.s-待办{background:rgba(35,131,226,.18);color:#5ba3f0}
.s-进行中{background:rgba(224,161,0,.18);color:#e0a100}
.s-已完成{background:rgba(77,171,154,.18);color:#4dab9a}
.s-未完成{background:rgba(217,115,13,.18);color:#d9730d}
.s-取消{background:rgba(224,62,62,.18);color:#e03e3e}
.p-高{background:rgba(224,62,62,.12);color:#e03e3e}
.p-中{background:rgba(224,161,0,.12);color:#e0a100}
.p-低{background:rgba(77,171,154,.12);color:#4dab9a}
.cat{background:rgba(144,101,176,.15);color:#b07fd0}
.stars{display:flex;gap:1px}
.star{cursor:pointer;font-size:14px;color:var(--border);user-select:none}
.star.on{color:#f5c518}
.task-actions{display:flex;gap:2px;opacity:0;transition:opacity .12s}
.task-item:hover .task-actions{opacity:1}
.notes-layout{display:grid;grid-template-columns:260px 1fr;gap:0;height:calc(100vh - 48px);margin:-32px -48px -80px}
@media(max-width:800px){.notes-layout{grid-template-columns:1fr}.notes-list-panel{display:none}}
.notes-list-panel{border-right:1px solid var(--border);overflow-y:auto;background:var(--sidebar);padding:12px}
.notes-list-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;padding:0 4px}
.notes-list-header h3{font-size:.85rem;font-weight:600}
.note-list-item{padding:10px 12px;border-radius:6px;cursor:pointer;margin-bottom:2px;transition:background .1s}
.note-list-item:hover{background:var(--hover)}
.note-list-item.active{background:var(--primary-soft)}
.note-list-item .title{font-size:.875rem;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.note-list-item .preview{font-size:.75rem;color:var(--text-dim);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.note-list-item .date{font-size:.7rem;color:var(--text-dim);margin-top:4px}
.note-editor-panel{overflow-y:auto;padding:32px 48px 80px}
@media(max-width:700px){.note-editor-panel{padding:20px 16px 60px}}
.note-toolbar{display:flex;gap:4px;margin-bottom:16px;flex-wrap:wrap;padding-bottom:12px;border-bottom:1px solid var(--border)}
.note-toolbar button{background:transparent;border:1px solid transparent;color:var(--text-muted);padding:5px 10px;border-radius:4px;cursor:pointer;font-size:.8rem;font-family:inherit}
.note-toolbar button:hover{background:var(--hover);color:var(--text)}
.note-toolbar button.active{background:var(--primary-soft);color:var(--primary)}
.note-body{min-height:400px;outline:none;font-size:1rem;line-height:1.75;color:var(--text)}
.note-body h1,.note-body h2,.note-body h3{margin:1.2em 0 .5em;font-weight:600}
.note-body h1{font-size:1.6rem}.note-body h2{font-size:1.3rem}.note-body h3{font-size:1.1rem}
.note-body p{margin-bottom:.8em}
.note-body ul,.note-body ol{padding-left:1.5em;margin-bottom:.8em}
.note-body code{font-family:var(--mono);background:var(--surface2);padding:2px 6px;border-radius:3px;font-size:.88em}
.note-body pre{background:var(--surface2);padding:14px;border-radius:6px;overflow-x:auto;margin:1em 0;font-family:var(--mono);font-size:.85rem}
.note-body blockquote{border-left:3px solid var(--primary);padding-left:14px;color:var(--text-muted);margin:1em 0}
.note-body a{color:var(--primary)}
.empty{text-align:center;padding:60px 20px;color:var(--text-dim)}
.empty-icon{font-size:2.5rem;margin-bottom:12px;opacity:.4}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;place-items:center;z-index:100;padding:16px}
.modal-overlay.show{display:grid}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:10px;width:100%;max-width:440px;box-shadow:0 16px 48px rgba(0,0,0,.45)}
.modal-header{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.modal-header h3{font-size:1rem;font-weight:600}
.modal-body{padding:18px}
.modal-footer{padding:0 18px 18px;display:flex;justify-content:flex-end;gap:8px}
.form-group{margin-bottom:14px}
.form-group label{display:block;font-size:.78rem;color:var(--text-muted);margin-bottom:5px}
.form-group input,.form-group select,.form-group textarea{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:6px;color:var(--text);font-family:inherit;font-size:.9rem;padding:9px 11px;outline:none}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{border-color:var(--primary)}
.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:10px 18px;border-radius:8px;font-size:.875rem;z-index:200;transition:transform .25s ease;pointer-events:none;box-shadow:0 8px 24px rgba(0,0,0,.3)}
.toast.show{transform:translateX(-50%) translateY(0)}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}::-webkit-scrollbar-thumb:hover{background:#555}
</style>
</head>
<body>
<aside class="sidebar" id="sidebar">
  <div class="sidebar-header"><div class="workspace-icon">◈</div><div class="workspace-name">Daily OS</div></div>
  <nav class="sidebar-nav">
    <div class="nav-section">
      <div class="nav-label">工作区</div>
      <div class="nav-item active" data-view="tasks" onclick="switchView('tasks')"><span class="icon">☑</span> 今日任务<span class="count" id="navTaskCount">0</span></div>
      <div class="nav-item" data-view="notes" onclick="switchView('notes')"><span class="icon">✎</span> 笔记<span class="count" id="navNoteCount">0</span></div>
    </div>
    <div class="nav-section">
      <div class="nav-label">快速</div>
      <div class="nav-item" onclick="openQuickCapture()"><span class="icon">⚡</span> 快速记录</div>
      <div class="nav-item" onclick="exportAll()"><span class="icon">↓</span> 导出全部数据</div>
    </div>
  </nav>
  <div class="sidebar-footer">数据仅保存在本机浏览器</div>
</aside>
<div class="main">
  <div class="topbar">
    <button class="menu-btn" id="toggleSidebar">☰</button>
    <div class="breadcrumb" id="breadcrumb"><span>Daily OS</span><span>/</span><strong>今日任务</strong></div>
    <div class="topbar-right"><span class="save-indicator" id="saveIndicator">已自动保存</span></div>
  </div>
  <div class="content" id="content"></div>
</div>
<div class="modal-overlay" id="taskModal">
  <div class="modal">
    <div class="modal-header"><h3 id="taskModalTitle">添加任务</h3><button class="btn-icon" onclick="closeTaskModal()">✕</button></div>
    <div class="modal-body">
      <div class="form-group"><label>任务内容 *</label><textarea id="taskContent" rows="3" placeholder="写清楚要做什么..."></textarea></div>
      <div class="form-group"><label>分类</label><input type="text" id="taskCategory" list="catList" placeholder="Bot开发 / 学习 / 研究..."/><datalist id="catList"><option value="Bot开发"><option value="RAG/Pipeline"><option value="模型研究"><option value="学习"><option value="学习/研究"><option value="个人管理"><option value="其他"></datalist></div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
        <div class="form-group"><label>状态</label><select id="taskStatus"><option value="待办">待办</option><option value="进行中">进行中</option><option value="已完成">已完成</option><option value="未完成">未完成</option><option value="取消">取消</option></select></div>
        <div class="form-group"><label>优先级</label><select id="taskPriority"><option value="高">高</option><option value="中" selected>中</option><option value="低">低</option></select></div>
      </div>
      <div class="form-group"><label>执行水平（1–5 星）</label><div class="stars" id="modalStars" style="font-size:20px;margin-top:4px"><span class="star" data-v="1">★</span><span class="star" data-v="2">★</span><span class="star" data-v="3">★</span><span class="star" data-v="4">★</span><span class="star" data-v="5">★</span></div><input type="hidden" id="taskScore" value="0"/></div>
      <div class="form-group"><label>备注</label><input type="text" id="taskNote" placeholder="可选"/></div>
    </div>
    <div class="modal-footer"><button class="btn btn-ghost" onclick="closeTaskModal()">取消</button><button class="btn btn-primary" onclick="saveTask()">保存</button></div>
  </div>
</div>
<div class="modal-overlay" id="quickModal">
  <div class="modal">
    <div class="modal-header"><h3>快速记录</h3><button class="btn-icon" onclick="closeQuick()">✕</button></div>
    <div class="modal-body">
      <div class="form-group"><label>记到哪里？</label><select id="quickTarget"><option value="task">今日任务</option><option value="note">新建笔记</option></select></div>
      <div class="form-group"><label>内容</label><textarea id="quickContent" rows="4" placeholder="随便写，之后再整理..."></textarea></div>
    </div>
    <div class="modal-footer"><button class="btn btn-ghost" onclick="closeQuick()">取消</button><button class="btn btn-primary" onclick="submitQuick()">保存</button></div>
  </div>
</div>
<div class="toast" id="toast"></div>
<script>
const DB_KEY='daily_os_v2';
function loadDB(){try{return JSON.parse(localStorage.getItem(DB_KEY))||{tasks:{},notes:[]}}catch{return{tasks:{},notes:[]}}}
function saveDB(db){localStorage.setItem(DB_KEY,JSON.stringify(db));flashSaved()}
function flashSaved(){const el=document.getElementById('saveIndicator');el.textContent='已自动保存';el.className='save-indicator saved';clearTimeout(window._saveTimer);window._saveTimer=setTimeout(()=>{el.className='save-indicator'},1500)}
function markSaving(){const el=document.getElementById('saveIndicator');el.textContent='保存中...';el.className='save-indicator saving'}
let currentView='tasks',currentDate=new Date(),editingTaskId=null,modalScore=0,currentNoteId=null,noteEditMode=true;
function toDateStr(d){const y=d.getFullYear();const m=String(d.getMonth()+1).padStart(2,'0');const day=String(d.getDate()).padStart(2,'0');return y+'-'+m+'-'+day}
function uid(){return 'id_'+Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function esc(s){const d=document.createElement('div');d.textContent=s||'';return d.innerHTML}
function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),2000)}
function switchView(view){currentView=view;document.querySelectorAll('.nav-item[data-view]').forEach(el=>el.classList.toggle('active',el.dataset.view===view));const titles={tasks:'今日任务',notes:'笔记'};document.getElementById('breadcrumb').innerHTML=`<span>Daily OS</span><span>/</span><strong>${titles[view]||view}</strong>`;render()}
document.getElementById('toggleSidebar').addEventListener('click',()=>document.getElementById('sidebar').classList.toggle('collapsed'));
function render(){try{const db=loadDB();const todayTasks=db.tasks[toDateStr(currentDate)]||[];document.getElementById('navTaskCount').textContent=todayTasks.length;document.getElementById('navNoteCount').textContent=(db.notes||[]).length;if(currentView==='tasks')renderTasks(db);else if(currentView==='notes')renderNotes(db)}catch(e){console.error('render error',e);document.getElementById('content').innerHTML='<div class="empty"><div class="empty-icon">⚠️</div><p>渲染出错</p><p style="font-size:0.8rem;margin-top:8px;color:#e03e3e">'+e.message+'</p></div>'}}
function renderTasks(db){const dateStr=toDateStr(currentDate);const tasks=db.tasks[dateStr]||[];const total=tasks.length;const done=tasks.filter(t=>t.status==='已完成').length;const progress=tasks.filter(t=>t.status==='进行中').length;const scored=tasks.filter(t=>t.score>0);const avg=scored.length?(scored.reduce((s,t)=>s+t.score,0)/scored.length).toFixed(1):'—';const order={'进行中':0,'待办':1,'未完成':2,'已完成':3,'取消':4};const sorted=[...tasks].sort((a,b)=>(order[a.status]??9)-(order[b.status]??9));
document.getElementById('content').innerHTML=`<div class="date-bar"><button class="btn btn-ghost btn-sm" onclick="changeDay(-1)">‹ 前一天</button><input type="date" value="${dateStr}" onchange="jumpDate(this.value)"/><button class="btn btn-ghost btn-sm" onclick="changeDay(1)">后一天 ›</button><button class="btn btn-ghost btn-sm" onclick="goToday()">今天</button><button class="btn btn-primary btn-sm" style="margin-left:auto" onclick="openTaskModal()">+ 添加任务</button></div><div class="quick-add"><input type="text" id="quickTaskInput" placeholder="输入任务，按 Enter 快速添加..." onkeydown="if(event.key==='Enter')quickAddTask()"/><button class="btn btn-primary" onclick="quickAddTask()">添加</button></div><div class="stats-row"><div class="stat-card"><div class="label">总任务</div><div class="value blue">${total}</div></div><div class="stat-card"><div class="label">已完成</div><div class="value green">${done}</div></div><div class="stat-card"><div class="label">进行中</div><div class="value yellow">${progress}</div></div><div class="stat-card"><div class="label">平均执行分</div><div class="value purple">${avg}</div></div></div><div class="task-list">${sorted.length===0?'<div class="empty"><div class="empty-icon">📝</div><p>这一天还没有任务</p><p style="margin-top:8px;font-size:.85rem">在上方输入框快速添加</p></div>':sorted.map(t=>taskHTML(t)).join('')}</div>`}
function taskHTML(t){return `<div class="task-item ${t.status==='已完成'?'done':''}"><div class="checkbox ${t.status==='已完成'?'checked':''}" onclick="toggleDone('${t.id}')"></div><div><div class="task-title">${esc(t.content)}</div><div class="task-meta"><span class="badge s-${t.status}">${t.status}</span><span class="badge p-${t.priority}">${t.priority}</span>${t.category?`<span class="badge cat">${esc(t.category)}</span>`:''}<span class="stars">${[1,2,3,4,5].map(v=>`<span class="star ${t.score>=v?'on':''}" onclick="setScore('${t.id}',${v})">★</span>`).join('')}</span></div>${t.note?`<div style="font-size:.8rem;color:var(--text-dim);margin-top:4px">${esc(t.note)}</div>`:''}</div><div class="task-actions"><button class="btn-icon" onclick="openTaskModal('${t.id}')" title="编辑">✎</button><button class="btn-icon" onclick="deleteTask('${t.id}')" title="删除">🗑</button></div></div>`}
function renderNotes(db){const notes=(db.notes||[]).slice().sort((a,b)=>new Date(b.updatedAt||b.createdAt)-new Date(a.updatedAt||a.createdAt));if(!currentNoteId&&notes.length)currentNoteId=notes[0].id;const note=notes.find(n=>n.id===currentNoteId);
document.getElementById('content').innerHTML=`<div class="notes-layout"><div class="notes-list-panel"><div class="notes-list-header"><h3>全部笔记</h3><button class="btn btn-primary btn-sm" onclick="createNote()">+ 新建</button></div>${notes.length===0?'<div class="empty" style="padding:30px 10px"><p style="font-size:.85rem">还没有笔记</p></div>':notes.map(n=>`<div class="note-list-item ${n.id===currentNoteId?'active':''}" onclick="selectNote('${n.id}')"><div class="title">${esc(n.title||'无标题')}</div><div class="preview">${esc((n.content||'').slice(0,60))}</div><div class="date">${(n.updatedAt||n.createdAt||'').slice(0,10)}</div></div>`).join('')}</div><div class="note-editor-panel">${!note?'<div class="empty"><div class="empty-icon">📄</div><p>选择或新建一篇笔记</p><button class="btn btn-primary" style="margin-top:16px" onclick="createNote()">新建笔记</button></div>':`<input class="page-title" id="noteTitle" value="${esc(note.title||'')}" placeholder="无标题" oninput="autoSaveNote()"/><div class="page-meta"><span>创建于 ${(note.createdAt||'').slice(0,10)}</span><span>更新于 ${(note.updatedAt||note.createdAt||'').slice(0,16).replace('T',' ')}</span></div><div class="note-toolbar"><button onclick="insertMd('**','**')" title="加粗">B</button><button onclick="insertMd('*','*')" title="斜体"><i>I</i></button><button onclick="insertMd('~~','~~')" title="删除线">S</button><button onclick="insertMd('\\n## ','')" title="标题">H2</button><button onclick="insertMd('- ','')" title="列表">• 列表</button><button onclick="insertMd('- [ ] ','')" title="待办">☐</button><button onclick="insertMd('\\`','\\`')" title="代码">code</button><button onclick="insertMd('> ','')" title="引用">“</button><span style="flex:1"></span><button class="${noteEditMode?'active':''}" onclick="setNoteMode(true)">编辑</button><button class="${!noteEditMode?'active':''}" onclick="setNoteMode(false)">预览</button><button class="btn btn-ghost btn-sm" onclick="deleteNote('${note.id}')" style="color:var(--danger)">删除</button></div>${noteEditMode?`<textarea class="note-body" id="noteBody" style="width:100%;min-height:420px;background:transparent;border:none;outline:none;color:var(--text);font-family:inherit;font-size:1rem;line-height:1.75;resize:vertical" placeholder="开始写作… 支持 Markdown" oninput="autoSaveNote()">${esc(note.content||'')}</textarea>`:`<div class="note-body" id="notePreview">${renderMarkdown(note.content||'')}</div>`}`}</div></div>`}
function getTodayTasks(){const db=loadDB();const key=toDateStr(currentDate);if(!db.tasks[key])db.tasks[key]=[];return{db,key,tasks:db.tasks[key]}}
function quickAddTask(){const input=document.getElementById('quickTaskInput');const content=(input?.value||'').trim();if(!content)return;const{db,key,tasks}=getTodayTasks();tasks.push({id:uid(),content,category:'',status:'待办',priority:'中',score:0,note:'',createdAt:new Date().toISOString()});db.tasks[key]=tasks;saveDB(db);input.value='';toast('已添加');render()}
function openTaskModal(id){editingTaskId=id||null;modalScore=0;document.getElementById('taskModalTitle').textContent=id?'编辑任务':'添加任务';if(id){const{tasks}=getTodayTasks();const t=tasks.find(x=>x.id===id);if(!t)return;document.getElementById('taskContent').value=t.content;document.getElementById('taskCategory').value=t.category||'';document.getElementById('taskStatus').value=t.status;document.getElementById('taskPriority').value=t.priority;document.getElementById('taskNote').value=t.note||'';modalScore=t.score||0;document.getElementById('taskScore').value=modalScore}else{document.getElementById('taskContent').value='';document.getElementById('taskCategory').value='';document.getElementById('taskStatus').value='待办';document.getElementById('taskPriority').value='中';document.getElementById('taskNote').value='';document.getElementById('taskScore').value='0'}updateModalStars();document.getElementById('taskModal').classList.add('show');setTimeout(()=>document.getElementById('taskContent').focus(),50)}
function closeTaskModal(){document.getElementById('taskModal').classList.remove('show')}
function saveTask(){const content=document.getElementById('taskContent').value.trim();if(!content){toast('请填写任务内容');return}const{db,key,tasks}=getTodayTasks();const payload={content,category:document.getElementById('taskCategory').value.trim(),status:document.getElementById('taskStatus').value,priority:document.getElementById('taskPriority').value,score:Number(document.getElementById('taskScore').value)||0,note:document.getElementById('taskNote').value.trim(),updatedAt:new Date().toISOString()};if(editingTaskId){const idx=tasks.findIndex(t=>t.id===editingTaskId);if(idx>=0)tasks[idx]={...tasks[idx],...payload}}else{tasks.push({id:uid(),...payload,createdAt:new Date().toISOString()})}db.tasks[key]=tasks;saveDB(db);closeTaskModal();toast('已保存');render()}
function deleteTask(id){if(!confirm('确定删除？'))return;const{db,key,tasks}=getTodayTasks();db.tasks[key]=tasks.filter(t=>t.id!==id);saveDB(db);toast('已删除');render()}
function toggleDone(id){const{db,key,tasks}=getTodayTasks();const t=tasks.find(x=>x.id===id);if(!t)return;t.status=t.status==='已完成'?'待办':'已完成';t.updatedAt=new Date().toISOString();saveDB(db);render()}
function setScore(id,score){const{db,key,tasks}=getTodayTasks();const t=tasks.find(x=>x.id===id);if(!t)return;t.score=t.score===score?0:score;t.updatedAt=new Date().toISOString();saveDB(db);render()}
function changeDay(delta){currentDate.setDate(currentDate.getDate()+delta);render()}
function goToday(){currentDate=new Date();render()}
function jumpDate(val){currentDate=new Date(val+'T12:00:00');render()}
function updateModalStars(){document.querySelectorAll('#modalStars .star').forEach(s=>s.classList.toggle('on',Number(s.dataset.v)<=modalScore))}
document.addEventListener('click',e=>{if(e.target.closest('#modalStars .star')){const v=Number(e.target.dataset.v);modalScore=modalScore===v?0:v;document.getElementById('taskScore').value=modalScore;updateModalStars()}});
function createNote(){const db=loadDB();if(!db.notes)db.notes=[];const note={id:uid(),title:'',content:'',createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()};db.notes.unshift(note);currentNoteId=note.id;noteEditMode=true;saveDB(db);render();setTimeout(()=>document.getElementById('noteTitle')?.focus(),50)}
function selectNote(id){currentNoteId=id;noteEditMode=true;render()}
function autoSaveNote(){markSaving();const db=loadDB();const note=(db.notes||[]).find(n=>n.id===currentNoteId);if(!note)return;const titleEl=document.getElementById('noteTitle');const bodyEl=document.getElementById('noteBody');if(titleEl)note.title=titleEl.value;if(bodyEl)note.content=bodyEl.value;note.updatedAt=new Date().toISOString();clearTimeout(window._noteSaveTimer);window._noteSaveTimer=setTimeout(()=>{saveDB(db);const listItem=document.querySelector('.note-list-item.active .title');if(listItem)listItem.textContent=note.title||'无标题';const preview=document.querySelector('.note-list-item.active .preview');if(preview)preview.textContent=(note.content||'').slice(0,60)},400)}
function setNoteMode(edit){autoSaveNote();noteEditMode=edit;render()}
function deleteNote(id){if(!confirm('确定删除这篇笔记？'))return;const db=loadDB();db.notes=(db.notes||[]).filter(n=>n.id!==id);if(currentNoteId===id)currentNoteId=db.notes[0]?.id||null;saveDB(db);toast('已删除');render()}
function insertMd(before,after){const ta=document.getElementById('noteBody');if(!ta)return;const start=ta.selectionStart,end=ta.selectionEnd,text=ta.value,selected=text.slice(start,end);ta.value=text.slice(0,start)+before+selected+after+text.slice(end);ta.focus();ta.selectionStart=ta.selectionEnd=start+before.length+selected.length;autoSaveNote()}
function renderMarkdown(src){let html=esc(src);html=html.replace(/```([\s\S]*?)```/g,(_,c)=>`<pre><code>${c}</code></pre>`);html=html.replace(/^### (.+)$/gm,'<h3>$1</h3>');html=html.replace(/^## (.+)$/gm,'<h2>$1</h2>');html=html.replace(/^# (.+)$/gm,'<h1>$1</h1>');html=html.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');html=html.replace(/\*(.+?)\*/g,'<em>$1</em>');html=html.replace(/~~(.+?)~~/g,'<del>$1</del>');html=html.replace(/`([^`]+)`/g,'<code>$1</code>');html=html.replace(/\[(.+?)\]\((.+?)\)/g,'<a href="$2" target="_blank">$1</a>');html=html.replace(/^&gt; (.+)$/gm,'<blockquote>$1</blockquote>');html=html.replace(/- \[ \] (.+)/g,'<div>☐ $1</div>');html=html.replace(/- \[x\] (.+)/gi,'<div>☑ $1</div>');html=html.replace(/^- (.+)$/gm,'<li>$1</li>');html=html.replace(/(<li>.*<\/li>\n?)+/g,m=>`<ul>${m}</ul>`);html=html.replace(/\n\n/g,'</p><p>');html='<p>'+html+'</p>';html=html.replace(/<p><\/p>/g,'');html=html.replace(/<p>(<h[1-3]>)/g,'$1').replace(/(<\/h[1-3]>)<\/p>/g,'$1');html=html.replace(/<p>(<ul>)/g,'$1').replace(/(<\/ul>)<\/p>/g,'$1');html=html.replace(/<p>(<pre>)/g,'$1').replace(/(<\/pre>)<\/p>/g,'$1');html=html.replace(/<p>(<blockquote>)/g,'$1').replace(/(<\/blockquote>)<\/p>/g,'$1');return html}
function openQuickCapture(){document.getElementById('quickContent').value='';document.getElementById('quickTarget').value='task';document.getElementById('quickModal').classList.add('show');setTimeout(()=>document.getElementById('quickContent').focus(),50)}
function closeQuick(){document.getElementById('quickModal').classList.remove('show')}
function submitQuick(){const content=document.getElementById('quickContent').value.trim();if(!content){toast('请输入内容');return}const target=document.getElementById('quickTarget').value;const db=loadDB();if(target==='task'){const key=toDateStr(new Date());if(!db.tasks[key])db.tasks[key]=[];db.tasks[key].push({id:uid(),content,category:'',status:'待办',priority:'中',score:0,note:'',createdAt:new Date().toISOString()});currentDate=new Date();currentView='tasks'}else{if(!db.notes)db.notes=[];const note={id:uid(),title:content.slice(0,40),content,createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()};db.notes.unshift(note);currentNoteId=note.id;currentView='notes'}saveDB(db);closeQuick();toast('已记录');switchView(currentView)}
function exportAll(){const db=loadDB();const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`daily-os-backup-${toDateStr(new Date())}.json`;a.click();toast('已导出全部数据')}
function seed(){const db=loadDB();const today=toDateStr(new Date());if(!db.tasks[today]||db.tasks[today].length===0){db.tasks[today]=[{id:uid(),content:'海盗牌bot阶段检查和代码整理总结',category:'Bot开发',status:'待办',priority:'高',score:0,note:'',createdAt:new Date().toISOString()},{id:uid(),content:'rag/notebooklm 幻觉测试 和 pipeline 工作流降低幻觉率',category:'RAG/Pipeline',status:'进行中',priority:'高',score:0,note:'执行中',createdAt:new Date().toISOString()},{id:uid(),content:'各大模型综述了解和研究',category:'模型研究',status:'待办',priority:'中',score:0,note:'',createdAt:new Date().toISOString()},{id:uid(),content:'学习 agent bilibili 知识',category:'学习',status:'待办',priority:'中',score:0,note:'',createdAt:new Date().toISOString()},{id:uid(),content:'学习 bot 强化学习知识，关注前沿论文',category:'学习/研究',status:'待办',priority:'中',score:0,note:'',createdAt:new Date().toISOString()},{id:uid(),content:'开始记录自己的成果',category:'个人管理',status:'待办',priority:'低',score:0,note:'',createdAt:new Date().toISOString()}]}if(!db.notes||db.notes.length===0){db.notes=[{id:uid(),title:'欢迎使用 Daily OS',content:'# 欢迎 👋\n\n这是一个轻量的「任务 + 笔记」工具，灵感来自 Notion。\n\n## 功能\n- **今日任务**：快速添加、状态管理、执行水平评分\n- **笔记**：支持 Markdown，自动保存\n- **快速记录**：随时捕捉想法\n\n## Markdown 示例\n- 普通列表\n- [ ] 待办事项\n- [x] 已完成\n\n```\n代码块也支持\n```\n\n> 引用文字\n\n**加粗** 和 *斜体*\n\n数据全部保存在你的浏览器本地，不会上传。',createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()}]}saveDB(db)}
document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key==='k'){e.preventDefault();openQuickCapture()}if(e.key==='Escape'){closeTaskModal();closeQuick()}});
document.getElementById('taskModal').addEventListener('click',e=>{if(e.target.id==='taskModal')closeTaskModal()});
document.getElementById('quickModal').addEventListener('click',e=>{if(e.target.id==='quickModal')closeQuick()});
seed();
